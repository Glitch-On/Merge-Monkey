[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "merge-monkey"
version = "0.1.0"
description = "Git conflict resolution with testing provenance"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7", "pytest-cov>=4"]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.5", "build>=1.0"]

[project.scripts]
git-mm = "merge_monkey.cli:main"
merge-monkey = "merge_monkey.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Strict: unknown markers or config keys fail, warnings are errors,
# and an xfail that starts passing fails too.
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["merge_monkey"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E741"]
