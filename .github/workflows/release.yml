name: Release

# Delivery: pushing a tag like v0.2.0 builds the package and attaches the wheel
# and sdist to a GitHub release. Uses only the built-in GITHUB_TOKEN; no other
# secrets are needed or stored.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test before releasing
        run: |
          python -m pip install -e '.[test]'
          python -m pytest -q
      - name: Build
        run: |
          python -m pip install build
          python -m build
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
