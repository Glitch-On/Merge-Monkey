name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show git version (merge-tree --merge-base needs git 2.40+)
        run: git --version

      - name: Install
        run: python -m pip install -e '.[test]'

      - name: Unit and end-to-end tests
        run: python -m pytest -v

      - name: Run the demo backport end to end
        env:
          NO_COLOR: "1"
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git mm demo /tmp/mm-demo
          cd /tmp/mm-demo
          git mm trace hotfix-812 --no-ai
          git mm predict --pick prod dev
          git cherry-pick -x hotfix-812 || true
          git mm explain --no-ai
          git mm resolve --prefer tested --no-ai
          git log -1 --format=%B | grep -q "Merge-Monkey-Theirs:"
          ! grep -q '<<<<<<<' settings.py
          git mm show HEAD | grep -q "NEEDS RETEST"
