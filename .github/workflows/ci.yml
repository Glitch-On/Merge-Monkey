name: CI

# Runs on every pull request and on main. Every job must pass before a PR merges,
# and the last commit on main must be green when repos are frozen.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: No API keys or secrets in the repo
        run: scripts/check_secrets.sh
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check src tests

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Show git version (merge-tree --merge-base needs git 2.40+)
        run: git --version
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Run tests
        run: python -m pytest -v --junitxml=test-results.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}
          path: test-results.xml

  e2e:
    name: End-to-end demo backport
    runs-on: ubuntu-latest
    env:
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Configure git identity
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
      - name: Predict, conflict, explain, resolve
        run: |
          git mm demo /tmp/mm-demo
          cd /tmp/mm-demo
          git mm trace hotfix-812 --no-ai
          git mm predict --pick prod dev | tee predict.txt
          grep -q "CONFLICT" predict.txt
          git cherry-pick -x hotfix-812 || true
          git mm explain --no-ai | tee explain.txt
          grep -q "Prefer THEIRS" explain.txt
          git mm resolve --prefer tested --no-ai
          git log -1 --format=%B | grep -q "Merge-Monkey-Theirs:"
          ! grep -q '<<<<<<<' settings.py
          git mm show HEAD | grep -q "NEEDS RETEST"
          git mm report -o report.html
      - name: Regenerate the examples/ outputs
        run: examples/run_demo_example.sh
      - name: Upload demo outputs
        uses: actions/upload-artifact@v4
        with:
          name: demo-outputs
          path: |
            examples/demo-backport/
            /tmp/mm-demo/report.html

  build:
    name: Build and install package
    runs-on: ubuntu-latest
    needs: [checks, test, e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          python -m pip install build
          python -m build
      - name: Install the wheel in a clean venv and run it
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          PATH=/tmp/clean/bin:$PATH git mm -h
          PATH=/tmp/clean/bin:$PATH git mm --version
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: merge-monkey-dist
          path: dist/
